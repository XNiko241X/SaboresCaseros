<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sabores Caseros">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2f7d4f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Sabores Caseros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3EE;--card:#fff;--tx:#1B2A1F;--mut:#5E7064;--ac:#2f7d4f;--acs:#DCEEE3;--bd:#D8E3DB;--bad:#C1443C;--shadow:0 1px 2px rgba(27,42,31,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141815;--card:#212623;--tx:#eeede8;--mut:#9aa59e;--bd:#333a35;--ac:#4fb27a;--acs:#25382d;--bad:#e5695a;--shadow:none}}
:root[data-theme="dark"]{--bg:#141815;--card:#212623;--tx:#eeede8;--mut:#9aa59e;--bd:#333a35;--ac:#4fb27a;--acs:#25382d;--bad:#e5695a;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 'Inter',system-ui,sans-serif;min-height:100vh;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 8px}
.top-in{max-width:560px;margin:0 auto}
.brand{display:flex;align-items:baseline;justify-content:space-between;padding:4px 4px 8px}
.brand h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--mut);font-weight:600}
main{padding:6px 14px 14px;max-width:560px;margin:0 auto}
h2{margin:4px 0 12px;font-size:20px;font-weight:800}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--mut);margin:16px 2px 8px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.mut{color:var(--mut);font-size:14px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;min-height:50px;padding:12px 14px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);margin:6px 0 12px;font-weight:600;font-size:16px}
input:focus,select:focus{outline:none;border-color:var(--ac)}
label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--mut);display:block}
button{border:1.5px solid var(--bd);background:var(--card);min-height:50px;padding:12px 18px;border-radius:14px;cursor:pointer;font-weight:700;font-size:15px}
button:active{transform:scale(.97)}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.bad{color:var(--bad);border-color:var(--bad)}
.sm{min-height:44px;padding:10px 16px;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chip{flex:1;min-width:52px;min-height:50px;padding:12px 6px;border-radius:999px;color:var(--mut)}
.chip.on{background:var(--acs);color:var(--ac);border-color:var(--ac)}
.done{opacity:.5;text-decoration:line-through}
.wa{flex:none;display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 16px;border-radius:14px;background:#25d366;color:#fff;text-decoration:none;font-size:15px;font-weight:700}
.cat{cursor:pointer;margin:16px 0 8px;padding:10px 4px;border-bottom:1.5px solid var(--bd);user-select:none}
.chk{width:34px;height:34px;margin:0;min-height:0;flex:none;accent-color:var(--ac)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:22px;padding:5px;box-shadow:var(--shadow);gap:5px}
.tabs button{flex:1;border:2px solid color-mix(in srgb,var(--t) 45%,transparent);border-radius:16px;background:transparent;color:var(--mut);min-height:52px;padding:10px 4px;font-size:16px;font-weight:700}
.tabs button.on{background:var(--t);color:#fff;border-color:var(--t)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd)}
.bottom .tabs{max-width:560px;margin:0 auto}
.ic{margin-right:6px}
.big{font-size:17px}
.pos{color:var(--bad);font-weight:700}.neg{color:var(--ac);font-weight:700}
.mono{font-family:'IBM Plex Mono',monospace}
.hero{background:var(--ac);color:#fff;border-radius:16px;padding:20px 18px;margin-bottom:12px}
.hero .l{font-size:13px;font-weight:600;opacity:.85}
.hero .v{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:32px;margin-top:4px}
.dayrow{padding:14px 0;border-bottom:1px solid var(--bd)}
.dayrow:last-child{border:0}
#modal{z-index:20;position:fixed;inset:0;background:rgba(18,26,20,.55);display:none;overflow:auto;padding:12px}
#modal .card{max-width:520px;margin:20px auto}
</style></head><body>
<div class="top"><div class="top-in">
  <div class="brand"><h1>Sabores Caseros</h1><span>Viandas</span></div>
  <nav class="tabs" id="nav"></nav>
</div></div>
<main id="app"></main>
<div id="modal"></div>
<script>
const DIAS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],ORD=[1,2,3,4,5,6,0];
let S={clientes:[],movs:[],hechos:{},cerr:{}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('viandas')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('viandas',JSON.stringify(S))}catch(e){}};
let abi={},tab='reparto',dia=new Date().getDay(),q='',armed=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const money=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('es-AR');
const saldo=id=>S.movs.filter(m=>m.c===id).reduce((a,m)=>a+(m.t==='cargo'?m.m:-m.m),0);
const byName=(a,b)=>a.nombre.localeCompare(b.nombre,'es');
const tur=c=>c.turnos&&c.turnos.length?c.turnos:['M'];
const TN={M:'Mediodía',N:'Noche'};
const turTxt=c=>tur(c).map(t=>TN[t]).join(' + ');
const hoy=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fmt=f=>f.split('-').reverse().join('/');
function waLink(t){
  let d=String(t||'').replace(/\D/g,'');if(!d)return '';
  d=d.replace(/^00/,'');
  if(d.startsWith('54')){if(d[2]!=='9')d='549'+d.slice(2)}
  else{d=d.replace(/^0/,'');
    if(d.length===12)for(const a of [2,3,4])if(d.slice(a,a+2)==='15'){d=d.slice(0,a)+d.slice(a+2);break}
    d='549'+d}
  return 'https://wa.me/'+d}
const SC='Sin categoría';
const catDe=c=>((c&&c.cat)||'').trim()||SC;
function agrupar(arr,catOf,tk,info,itemFn){
  const g={};arr.forEach(x=>{const k=catOf(x);(g[k]=g[k]||[]).push(x)});
  const keys=Object.keys(g).sort((a,b)=>(a===SC)-(b===SC)||a.localeCompare(b,'es'));
  return keys.map(k=>{
    const ab=tk==='saldos'?!!abi[k]:(tk==='clientes'&&q)||!S.cerr[tk+'|'+k];
    return `<div class="row cat" onclick="togCat('${tk}','${encodeURIComponent(k).replace(/'/g,'%27')}')"><b class="big">${ab?'▾':'▸'} ${esc(k)}</b><span class="mut">${info(g[k],k)}</span></div>`+(ab?g[k].map(itemFn).join(''):'')}).join('')}
function togCat(tk,k){k=decodeURIComponent(k);const key=tk+'|'+k;if(tk==='saldos')abi[k]=!abi[k];else{S.cerr[key]=!S.cerr[key];save()}if(tk==='clientes')lista();else render()}
const cli=id=>S.clientes.find(c=>c.id===id);
// confirmación en dos toques (sin confirm())
function two(key,fn,btn,txt){if(armed===key){armed=null;fn();return}armed=key;btn.textContent='¿Seguro? Tocá de nuevo';setTimeout(()=>{if(armed===key){armed=null;btn.textContent=txt}},3000)}

const TABS={reparto:['🚚','#c94545','Reparto'],clientes:['👥','#2b6cb0','Clientes'],saldos:['💰','#c26a12','Saldos'],resumen:['📊','#7c4dbd','Resumen']};
function go(t){tab=t;render();window.scrollTo(0,0)}
function navBar(){
  const mk=t=>`<button style="--t:${TABS[t][1]}" class="${t===tab?'on':''}" onclick="go('${t}')"><span class="ic">${TABS[t][0]}</span>${TABS[t][2]}</button>`;
  $('#nav').innerHTML=['reparto','clientes','saldos','resumen'].map(mk).join('')}
function render(){navBar();$('#app').innerHTML=({reparto:vReparto,clientes:vPedidos,saldos:vMovs,resumen:vResumen})[tab]()}

function vReparto(){
  const e=[];
  S.clientes.filter(c=>c.dias.includes(dia)).forEach(c=>tur(c).forEach(t=>e.push([c,t])));
  const dn=x=>S.hechos[x[0].id+'|'+x[1]]?1:0;
  e.sort((a,b)=>a[1].localeCompare(b[1])||dn(a)-dn(b)||byName(a[0],b[0]));
  const h=e.filter(([c,t])=>S.hechos[c.id+'|'+t]).length;
  let last='';
  const items=e.map(([c,t])=>{
    const k=c.id+'|'+t,d=S.hechos[k];
    const head=t!==last?`<h3>${TN[t]}</h3>`:'';last=t;
    return head+`<label class="card row" style="cursor:pointer;text-transform:none;letter-spacing:0;font-size:16px;color:var(--tx);font-weight:400"><div class="${d?'done':''}" style="flex:1"><b class="big">${esc(c.nombre)}</b> | ${c.cant} vianda${c.cant>1?'s':''}<div class="mut">${[c.dir,c.tel,c.notas].filter(Boolean).map(esc).join(' | ')}</div></div>
    ${c.tel&&waLink(c.tel)?`<a class="wa" href="${waLink(c.tel)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">WhatsApp</a>`:''}
    <input class="chk" type="checkbox" ${d?'checked':''} onchange="tilde('${k}',this.checked)"></label>`}).join('');
  return `<h2>Reparto</h2>
  <div class="chips">${ORD.map(d=>`<button class="chip ${d===dia?'on':''}" onclick="dia=${d};render()">${DIAS[d]}</button>`).join('')}</div>
  <div class="row" style="margin-bottom:6px"><span class="mut">${h} de ${e.length} entregadas</span>
  <button class="sm" onclick="two('reset',()=>{S.hechos={};save();render()},this,'Restablecer lista')">Restablecer lista</button></div>
  ${items||'<div class="card mut" style="text-align:center">No hay viandas para este día.</div>'}`}
function tilde(id,v){if(v)S.hechos[id]=1;else delete S.hechos[id];save();render()}

function vPedidos(){
  const l=S.clientes.filter(c=>c.nombre.toLowerCase().includes(q.toLowerCase())).sort(byName);
  return `<div class="row"><h2>Clientes (${S.clientes.length})</h2><button class="pri" onclick="abrirForm()">+ Nuevo</button></div>
  <input id="q" placeholder="Buscar cliente…" value="${esc(q)}" oninput="q=this.value;lista()">
  <div id="lista">${itemsP(l)}</div>`}
function itemC(c){const sd=saldo(c.id);return `<div class="card row" style="cursor:pointer" onclick="abrirForm('${c.id}')"><div style="flex:1"><b class="big">${esc(c.nombre)}</b> | ${c.cant} vianda${c.cant>1?'s':''}<div class="mut">${[esc(c.tel),turTxt(c),c.dias.length?ORD.filter(d=>c.dias.includes(d)).map(d=>DIAS[d]).join(' '):'Sin días'].filter(Boolean).join(' | ')}</div></div><div style="text-align:right"><b class="mono ${sd>0?'pos':sd<0?'neg':''}">${money(sd)}</b><div class="mut">saldo</div></div></div>`}
function itemsP(l){return l.map(itemC).join('')||'<div class="card mut" style="text-align:center">Sin clientes.</div>'}
function lista(){$('#lista').innerHTML=itemsP(S.clientes.filter(c=>c.nombre.toLowerCase().includes(q.toLowerCase())).sort(byName))}

function abrirForm(id){
  const c=cli(id)||{nombre:'',dir:'',tel:'',cant:1,dias:[1,2,3,4,5],notas:'',turnos:['M']};
  const m=$('#modal');m.style.display='block';
  m.innerHTML=`<div class="card"><h2>${id?'Editar':'Nuevo'} cliente</h2>
  <label>Nombre<input id="f-n" maxlength="30" value="${esc(c.nombre)}"></label>
  <label>Dirección<input id="f-d" maxlength="30" value="${esc(c.dir)}"></label>
  <label>Teléfono<input id="f-t" type="tel" maxlength="30" value="${esc(c.tel)}"></label>
  <label>Viandas por día<input id="f-c" type="text" inputmode="numeric" maxlength="2" oninput="this.value=this.value.replace(/\D/g,'')" value="${c.cant}"></label>
  <label>Días</label><div class="chips" id="f-dias">${ORD.map(d=>`<button type="button" class="chip ${c.dias.includes(d)?'on':''}" data-d="${d}" onclick="this.classList.toggle('on')">${DIAS[d]}</button>`).join('')}</div>
  <label>Entrega</label><div class="chips" id="f-tur">${['M','N'].map(t=>`<button type="button" class="chip ${tur(c).includes(t)?'on':''}" data-t="${t}" onclick="this.classList.toggle('on')">${TN[t]}</button>`).join('')}</div>
  <div id="f-err" class="mut" style="color:var(--bad)"></div>
  <label>Notas<input id="f-o" maxlength="30" value="${esc(c.notas)}"></label>
  <div class="row" style="margin-top:12px"><button style="flex:1" onclick="cerrar()">Cancelar</button>
  ${id?`<button class="bad" style="flex:1" onclick="two('del',()=>{S.clientes=S.clientes.filter(x=>x.id!=='${id}');save();cerrar()},this,'Eliminar')">Eliminar</button>`:''}
  <button class="pri" style="flex:1" onclick="guardar('${id||''}')">Guardar</button></div></div>`}
function guardar(id){
  const n=$('#f-n').value.trim();if(!n){$('#f-n').focus();return}
  const norm=x=>x.trim().toLowerCase().replace(/\s+/g,' ');
  if(S.clientes.some(x=>x.id!==id&&norm(x.nombre)===norm(n))){$('#f-err').textContent='Ya existe un cliente con ese nombre.';$('#f-n').focus();return}
  const tu=[...document.querySelectorAll('#f-tur .on')].map(b=>b.dataset.t);
  if(!tu.length){$('#f-err').textContent='Elegí Mediodía, Noche o los dos.';return}
  const o={id:id||uid(),nombre:n,dir:$('#f-d').value.trim(),tel:$('#f-t').value.trim(),cant:Math.max(1,+$('#f-c').value||1),
   dias:[...document.querySelectorAll('#f-dias .on')].map(b=>+b.dataset.d),turnos:tu,notas:$('#f-o').value.trim()};
  const i=S.clientes.findIndex(x=>x.id===id);if(i>=0)S.clientes[i]=o;else S.clientes.push(o);
  save();cerrar()}
function cerrar(){$('#modal').style.display='none';render()}

function vMovs(){
  const l=[...S.movs].sort((a,b)=>b.f.localeCompare(a.f)||b.id.localeCompare(a.id));
  const item=m=>`<div class="card"><div class="row"><div><b class="big">${esc(cli(m.c)?.nombre||'(eliminado)')}</b><div class="mut">${fmt(m.f)} | ${m.t==='cargo'?'Debe':'Pagó'}${m.n?' | '+esc(m.n):''}</div></div>
  <div class="mono ${m.t==='cargo'?'pos':'neg'}" style="font-size:17px">${m.t==='cargo'?'+':'−'}${money(m.m)}</div></div>
  <div class="row" style="margin-top:12px;gap:8px"><button class="sm" style="flex:1" onclick="abrirMov('${m.id}')">Editar</button>
  <button class="bad sm" style="flex:1" onclick="two('m${m.id}',()=>{S.movs=S.movs.filter(x=>x.id!=='${m.id}');save();render()},this,'Borrar')">Borrar</button></div></div>`;
  const info=it=>'Saldo '+money(it.reduce((a,m)=>a+(m.t==='cargo'?m.m:-m.m),0));
  const tot=S.clientes.reduce((a,c)=>a+saldo(c.id),0);
  return `<div class="row"><h2>Saldos</h2><button class="pri" onclick="abrirMov()">+ Nuevo</button></div>
  <div class="hero" style="background:#c26a12"><div class="l">Saldo total a cobrar</div><div class="v">${money(tot)}</div></div>`+(agrupar(l,m=>cli(m.c)?.nombre||'(eliminado)','saldos',info,item)||'<div class="card mut" style="text-align:center">Sin movimientos.</div>')}
function abrirMov(id){
  const e=id?S.movs.find(x=>x.id===id):null;
  const m=$('#modal');m.style.display='block';
  if(!S.clientes.length){m.innerHTML=`<div class="card"><p>Primero cargá un cliente en la pestaña Clientes.</p><button onclick="cerrar()">Cerrar</button></div>`;return}
  m.innerHTML=`<div class="card"><h2>${e?'Editar':'Nuevo'} movimiento</h2>
  <label>Cliente<input id="m-q" autocomplete="off" placeholder="Escribí 2 o 3 letras del nombre…" value="${e&&cli(e.c)?esc(cli(e.c).nombre):''}" oninput="filtCli(true)" onfocus="this.select();filtCli()"></label>
  <input type="hidden" id="m-c" value="${e?e.c:''}">
  <div id="m-l" style="max-height:200px;overflow:auto;margin:-6px 0 10px"></div>
  <label>Tipo<select id="m-t"><option value="cargo" ${e&&e.t==='cargo'?'selected':''}>Debe</option><option value="pago" ${e&&e.t==='pago'?'selected':''}>Pagó</option></select></label>
  <label>Fecha<input id="m-f" type="date" value="${e?e.f:hoy()}"></label>
  <label>Monto<input id="m-m" type="text" inputmode="numeric" autocomplete="off" oninput="fmtMonto(this)" value="${e?Math.round(e.m).toLocaleString('es-AR'):''}"></label>
  <label>Nota<input id="m-n" placeholder="Opcional" value="${e?esc(e.n||''):''}"></label>
  <div class="row" style="margin-top:12px"><button style="flex:1" onclick="cerrar()">Cancelar</button><button class="pri" style="flex:1" onclick="addMov('${id||''}')">Guardar</button></div></div>`;
  if(!e)$('#m-q').focus()}
const nz=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function filtCli(typing){
  const t=nz($('#m-q').value.trim()),h=$('#m-c');
  const l=[...S.clientes].sort(byName).filter(c=>nz(c.nombre).includes(t));
  if(typing)h.value='';
  if(!t){$('#m-l').innerHTML='';return}
  if(l.length===1)h.value=l[0].id;
  $('#m-l').innerHTML=l.map(c=>`<button type="button" class="${c.id===h.value?'pri':''}" style="display:block;width:100%;text-align:left;margin-bottom:6px" onclick="pickCli('${c.id}')">${esc(c.nombre)}</button>`).join('')||'<div class="mut">Sin resultados</div>'}
function pickCli(id){$('#m-c').value=id;$('#m-q').value=cli(id).nombre;$('#m-l').innerHTML='';$('#m-m').focus()}
function fmtMonto(el){
  const pos=el.selectionStart,antes=el.value.slice(0,pos).replace(/\D/g,'').length;
  const d=el.value.replace(/\D/g,'').slice(0,7);
  el.value=d?(+d).toLocaleString('es-AR'):'';
  let n=0,i=0;
  if(antes>0){for(;i<el.value.length;i++){if(/\d/.test(el.value[i]))n++;if(n>=Math.min(antes,d.length)){i++;break}}}
  try{el.setSelectionRange(i,i)}catch(e){}}
function addMov(id){
  const m=+$('#m-m').value.replace(/\D/g,''),c=$('#m-c').value;if(!c){$('#m-q').focus();return}if(!m||m<=0){$('#m-m').focus();return}
  const o={id:id||uid(),c,t:$('#m-t').value,m,n:$('#m-n').value.trim(),f:$('#m-f').value||hoy()};
  const i=id?S.movs.findIndex(x=>x.id===id):-1;if(i>=0)S.movs[i]=o;else S.movs.push(o);save();cerrar()}

function vResumen(){
  const act=S.clientes;
  const por=ORD.map(d=>[d,act.filter(c=>c.dias.includes(d)).reduce((a,c)=>a+c.cant,0)]);
  const tot=por.reduce((a,x)=>a+x[1],0);
  return `<h2>Resumen</h2>
  <div class="hero" style="background:#7c4dbd"><div class="l">Viandas por semana</div><div class="v">${tot}</div></div>
  <h3>Viandas por día</h3>
  <div class="card">${por.map(([d,n])=>`<div class="row dayrow"><span class="big">${DIAS[d]}</span><b class="mono big">${n}</b></div>`).join('')}</div>`}
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
